name: Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and build dependencies
        run: python -m pip install -e ".[dev]" pyinstaller
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Build application folder
        run: python -m PyInstaller --noconfirm --clean packaging\divyaraj.spec
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          New-Item -ItemType Directory -Force dist\installer | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }
      - name: Upload installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/DivyarajSetup.exe
