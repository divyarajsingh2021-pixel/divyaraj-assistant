[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "divyaraj-assistant"
version = "0.1.0"
description = "A voice-first personal AI assistant."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "duckduckgo-search>=7.0",
    "faster-whisper>=1.0",
    "httpx>=0.27",
    "numpy>=1.23",
    "ollama>=0.4",
    "piper-tts>=1.2",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "pyttsx3>=2.90",
    "sounddevice>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
divyaraj = "divyaraj.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
